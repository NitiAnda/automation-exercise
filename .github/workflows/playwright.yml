name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/AutomationExercise.Tests.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore tests/AutomationExercise.Tests

      - name: Build
        run: dotnet build tests/AutomationExercise.Tests --no-restore --configuration Release

      - name: Install Playwright browsers
        run: pwsh tests/AutomationExercise.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run tests
        run: >
          dotnet test tests/AutomationExercise.Tests
          --no-build
          --configuration Release
          --settings tests/AutomationExercise.Tests/.runsettings
          --logger "trx;LogFileName=results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/AutomationExercise.Tests/bin/Release/net10.0/playwright-report/
          retention-days: 14

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/AutomationExercise.Tests/bin/Release/net10.0/playwright-traces/
          retention-days: 14

      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          path: TestResults/
          retention-days: 14
